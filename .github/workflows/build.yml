name: Build ModEngine

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Clone ESPFF + ScreenProtectorKit
        run: |
          git clone https://github.com/Fl0rk/External_ESP_Free_Fire Sources/ESPFF
          git clone https://github.com/Fl0rk/ScreenProtectorKit-Spoof Sources/ScreenProtectorKit

      - name: Install Theos
        env:
          THEOS: /Users/runner/theos
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          export THEOS=/Users/runner/theos
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)" || true

      - name: Symlink Xcode iOS SDK ke Theos
        run: |
          set -e
          mkdir -p /Users/runner/theos/sdks

          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          SDK_NAME=$(basename $SDK_PATH)

          echo "SDK found: $SDK_PATH"
          ln -sf "$SDK_PATH" "/Users/runner/theos/sdks/$SDK_NAME"
          ls /Users/runner/theos/sdks/

      - name: Set env
        run: |
          echo "THEOS=/Users/runner/theos" >> $GITHUB_ENV

      - name: Verify setup
        run: |
          echo "=== Source tree ==="
          find Sources -maxdepth 3 -type f -name "*.mm" -o -name "*.h" | head -40
          echo "=== SDKs ==="
          ls $THEOS/sdks/
          echo "=== Substrate ==="
          ls $THEOS/vendor/lib/ | grep -i sub || echo "MISSING substrate"

      - name: Build dylib
        run: |
          set -e

          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          ARCH="arm64"

          SUBSTRATE_INC=""
          if [ -d "$THEOS/vendor/include/CydiaSubstrate" ]; then
            SUBSTRATE_INC="-I$THEOS/vendor/include/CydiaSubstrate"
          fi

          if ls $THEOS/vendor/lib/libsubstrate.* 1>/dev/null 2>&1; then
            SUBSTRATE_LIB="-lsubstrate"
          elif ls $THEOS/vendor/lib/libsubstitute.* 1>/dev/null 2>&1; then
            SUBSTRATE_LIB="-lsubstitute"
          else
            echo "[ERROR] No substrate lib found"
            ls $THEOS/vendor/lib/
            exit 1
          fi

          CFLAGS="
            -arch $ARCH
            -isysroot $SDK
            -mios-version-min=13.0
            -std=c++17
            -O2
            -fvisibility=hidden
            -fPIC
            -I$THEOS/vendor/include
            $SUBSTRATE_INC
            -ISources
            -ISources/ESPFF
            -ISources/ESPFF/headers
            -ISources/ESPFF/sources
            -ISources/ESPFF/esp
            -ISources/ESPFF/esp/Core
            -ISources/ESPFF/esp/drawing_view
            -ISources/ScreenProtectorKit
            -DSUBSTRATE_AVAILABLE=1
          "

          LDFLAGS="
            -arch $ARCH
            -isysroot $SDK
            -dynamiclib
            -install_name @rpath/ModEngine.dylib
            -framework Foundation
            -framework UIKit
            -framework CoreGraphics
            $SUBSTRATE_LIB
            -L$THEOS/vendor/lib
          "

          mkdir -p build

          clang++ $CFLAGS \
            -x objective-c++ \
            Sources/ModEngine.mm \
            Sources/MenuView.mm \
            $LDFLAGS \
            -o build/ModEngine.dylib

          echo "======================================"
          echo "BUILD OK"
          echo "======================================"
          file build/ModEngine.dylib
          ls -lh build/ModEngine.dylib

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ModEngine
          path: build/ModEngine.dylib
